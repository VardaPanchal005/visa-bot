name: Visa Bot Cron

on:
  schedule:
    - cron: "30 5 * * *"   # 11 AM IST
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run script
        run: node index.js
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          MY_IRL: ${{ secrets.MY_IRL }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          PAGE_URL: ${{ secrets.PAGE_URL }}

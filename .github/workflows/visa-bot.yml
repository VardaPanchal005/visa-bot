name: Visa Bot Cron

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Debug env
        run: |
          echo "EMAIL=$EMAIL"
          echo "MY_IRL=$MY_IRL"
          echo "PAGE_URL=$PAGE_URL"
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          MY_IRL: ${{ secrets.MY_IRL }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          PAGE_URL: ${{ secrets.PAGE_URL }}

      - name: Run script
        run: node index.js
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          MY_IRL: ${{ secrets.MY_IRL }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          PAGE_URL: ${{ secrets.PAGE_URL }}
